services:
  jira-tracker:
    build: .
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      PORT: 3000
      DATABASE_PATH: /data/jira-tracker.sqlite
      JIRA_WEBHOOK_SECRET: ${JIRA_WEBHOOK_SECRET:?JIRA_WEBHOOK_SECRET is required}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-${VITE_JIRA_BASE_URL:-}}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      LOG_WEBHOOK_BODY: ${LOG_WEBHOOK_BODY:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - '${DATABASE_VOLUME:-jira-tracker-data}:/data:Z'

volumes:
  jira-tracker-data:
